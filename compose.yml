services:
  client:
    image: taimoorhussain/github-actions-client
    container_name: client
    ports:
      - "4173:4173"
    depends_on:
      - server

  server:
    image: taimoorhussain/github-actions-server
    container_name: server
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://db:27017/bookapp
    depends_on:
      - db

  db:
    image: mongo
    container_name: mongo_db
    ports:
      - "27017:27017"
    # environment:
    #   MONGO_INITDB_ROOT_USERNAME: admin
    #   MONGO_INITDB_ROOT_PASSWORD: admin
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
    driver: local
