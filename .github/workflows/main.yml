name: GITHUB_ACTIONS flow

on:
  push:
    branches:
      - main

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      client_changed: ${{ steps.filter.outputs.client }}
      server_changed: ${{ steps.filter.outputs.server }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            client:
              - 'client/**'
            server:
              - 'server/**'

  client:
    needs: check-changes
    runs-on: ubuntu-latest
    if: needs.check-changes.outputs.client_changed == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Docker Image
        run: |
          cd client
          docker build -t taimoorhussain/github-actions-client .

      - name: Push Docker Image
        env: 
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker push taimoorhussain/github-actions-client
          docker logout

      - name: Deploy Client Container
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_IP }} \
            "cd /var/www/html/github_actions_deployment_docker_ci-cd && \
             docker pull taimoorhussain/github-actions-client && \
             docker compose up -d --no-deps --build client"

  server:
    needs: check-changes
    runs-on: ubuntu-latest
    if: needs.check-changes.outputs.server_changed == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Docker Image
        run: |
          cd server
          docker build -t taimoorhussain/github-actions-server .

      - name: Push Docker Image
        env: 
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker push taimoorhussain/github-actions-server
          docker logout

      - name: Deploy Server Container
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_IP }} \
            "cd /var/www/html/github_actions_deployment_docker_ci-cd && \
             docker pull taimoorhussain/github-actions-server && \
             docker compose up -d --no-deps --build server"
